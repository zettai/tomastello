# Next.js on Netlify (serverless functions + edge middleware). See docs/NETLIFY.md.
# The site is linked to GitHub with auto-publishing locked: a push to main builds a deploy,
# and publishing it is a separate, manual step. Nothing in .github/workflows deploys.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # The lockfile was generated with legacy peer deps; plain `npm ci` refuses it.
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
