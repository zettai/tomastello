name: Deploy to Development
on: [workflow_dispatch]

jobs:
  test-and-analyze:
    name: Test and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run tests with coverage
        run: npm test -- --coverage
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: test-and-analyze
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 192.168.254.31 >> ~/.ssh/known_hosts
      - name: Login to Gitea Container Registry
        run: |
          echo "Attempting to login to registry..."
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login 192.168.254.85:3000 -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
      - name: Build the Docker image
        run: docker build --platform linux/amd64 . -t 192.168.254.85:3000/luis/next-tt:latest
      - name: Push the Docker Image
        run: docker push 192.168.254.85:3000/luis/next-tt:latest
      - name: Deploy to server
        run: |
          echo "Deploying to server lili@192.168.254.31..."
          ssh -o StrictHostKeyChecking=no lili@192.168.254.31 "cd ~/next-tt && ./deploy.sh"
          echo "Deployment completed with status: $?"
