# Dependency updates. Minor and patch npm updates arrive as one grouped pull request a week;
# majors come one by one. Nothing merges or deploys by itself: pushes build but publishing is
# manual (see DEPLOYMENT.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
